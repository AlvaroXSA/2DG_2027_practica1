<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p4-tutorial-css</title>
</head>
<style>
:root {
    --primary-color: #3498db;
    --secondary-color: #2ecc71;
}

body {
    font-size: 30px;
    background-color: var(--primary-color);
}

h1 {
    box-sizing: border-box;
    width: 500px;
    height: 500px;
    margin: 50px 0;
    padding: 100px;
    border: 14px solid var(--secondary-color);
    background-color: var(--primary-color);
    font-size: 1em;
}

p {
    background-color: var(--primary-color);
    box-sizing: border-box;
    border: 14px solid var(--secondary-color);
    background-color: var(--secondary-color);
    margin: 50px 10px;
    padding: 10px;
    font-size: 1em;
}

p:first-of-type,
p:nth-of-type(2) {
    color: var(--primary-color);
    font-size: 1em;
}



</style>
</head>
<body>
<h1>p4 tutorial css</h1>
    <p>Frase de ejemplo</p>
    <p>Frase de ejemplo 2</p>


    
</body>
</html>
